name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Client Dependencies & Build Client
        run: |
          npm run build

      - name: Install Server Dependencies (Production Check)
        run: |
          npm ci --only=production

      - name: Docker Build Test
        run: |
          docker build -t bb-app:test .

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping auto-deployment."
            exit 1
          else
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          fi